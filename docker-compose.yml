version: '3.4'

services:
  helpdesk-db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    networks:
      - helpdesk-network

  helpdesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=helpdesk-db;Database=HelpdeskDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True
      - JwtSettings__Secret=YourSuperSecretKeyForJWTAuthentication12345!
      - JwtSettings__Issuer=HelpdeskApi
      - JwtSettings__Audience=HelpdeskClient
      - JwtSettings__DurationInMinutes=60
    ports:
      - "8080:8080"
    depends_on:
      - helpdesk-db
    networks:
      - helpdesk-network

networks:
  helpdesk-network:
    driver: bridge
